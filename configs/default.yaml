# Study configuration. Every number that defines the dataset lives here and is
# copied into the dataset manifest, so a dataset can always be regenerated.
# The block of the selected circuit (`circuits.<name>`) is merged over the rest.

seed: 20261002
circuit: integrated            # integrated (main) | reference (discrete three-op-amp)

circuits:
  integrated:                  # single 3.3 V supply, integrated INA + discrete network
    supply: {vcc: 3.3, vee: 0.0}
    opamp:                     # generic rail-to-rail CMOS op-amp (behavioural)
      aol: 1.0e+6
      gbw: 1.0e+6
      rout: 50.0
      en: 30.0e-9              # white input voltage noise [V/sqrt(Hz)]
      headroom: 0.05           # output saturates at rail -+ headroom [V]
      vos_max: 0.5e-3          # Monte Carlo: offset drawn in +-vos_max [V]
      aol_rel: 0.5             # Monte Carlo: aol drawn in nominal * (1 +- aol_rel)
    ina:                       # generic integrated INA, G = 1 + 2 * rfb / Rg (behavioural)
      rfb: 50.0e+3
      cmrr_db: 100.0
      cmrr_db_tol: 6.0         # Monte Carlo: +- dB
      vos_max: 100.0e-6
      gain_error_max: 1.0e-3   # Monte Carlo: internal gain error, relative
    measurement:
      adc: {bits: 12, vmin: 0.0, vmax: 3.3, noise_rms: 1.0e-3, dc_averages: 64}
      dc_nodes:
        out: {scale: 1.0, extended: false}
        ina_out: {scale: 1.0, extended: true}
        rld_out: {scale: 1.0, extended: true}
  reference:                   # +-5 V, discrete three-op-amp INA (version 1 circuit)
    supply: {vcc: 5.0, vee: -5.0}
    opamp:                     # TL07x-like figures
      aol: 2.0e+5
      gbw: 3.0e+6
      rout: 50.0
      en: 18.0e-9
      headroom: 1.5
      vos_max: 3.0e-3
      aol_rel: 0.5
    measurement:
      adc: {bits: 12, vmin: -2.5, vmax: 2.5, noise_rms: 1.0e-3, dc_averages: 64}
      dc_nodes:
        out: {scale: 1.0, extended: false}
        ina_out: {scale: 0.5, extended: true}
        rld_out: {scale: 0.5, extended: true}

# --- Normal manufacturing variation (healthy circuits) -----------------------
tolerances:
  distribution: uniform        # uniform | truncnorm (sigma = tol/3, truncated at +-tol)
  resistor: 0.01
  capacitor: 0.05
  overrides: {}                # per designator, e.g. {C5: 0.10}

# --- Skin-electrode interface: Ehc in series with Rs and (Rd || Cd) ------------
# PROVISIONAL ranges, to be backed by the references of the state-of-the-art review.
electrodes:
  nominal: {ehc: 0.222, rs: 1.0e+3, rd: 51.0e+3, cd: 47.0e-9}
  ehc_abs: 5.0e-3              # half-cell potential spread, +- [V]
  families:                    # healthy ranges, drawn log-uniformly per electrode
    gel: {rs: [100.0, 1.0e+3], rd: [20.0e+3, 100.0e+3], cd: [20.0e-9, 100.0e-9]}
    dry: {rs: [50.0, 100.0e+3], rd: [80.0e+3, 3.0e+6], cd: [2.0e-9, 50.0e-9]}
  mix: {gel: 0.5, dry: 0.5}    # probability of each family per simulated case

# Patient/mains coupling in service (Winter & Webster model). Mains is off during self-test.
environment:
  c_mains_body: 2.0e-12
  c_body_earth: 200.0e-12
  c_iso: 200.0e-12
  r_iso: 1.0e+9
  mains_freq: 50.0

# --- Clinical specifications (functional severity) -----------------------------
# PROVISIONAL limits and test set-up: confirm against IEC 60601-2-25 / 60601-2-27.
# Specifications are properties of the circuit, so they are evaluated with a
# standard test network at the inputs, not with the patient's electrodes.
specs:
  gain_error_max: 0.05         # |G / G_nominal - 1| at 10 Hz
  f_low_max: 0.67              # lower -3 dB frequency [Hz]
  f_high_min: 150.0            # upper -3 dB frequency [Hz]
  cmrr_min_db: 95.0            # 20 V rms through 200 pF must stay below 1 mV p-p at the input
  noise_max_uvpp: 30.0         # input-referred, 0.05-150 Hz, taken as 6.6 x rms
  offset_gain_error_max: 0.05  # gain change at 10 Hz with the electrode DC offset below
  output_offset_max: 0.5       # |V(out) - ADC mid-scale| at rest [V]
  electrode_offset: 0.3        # [V]
  test_network:
    imbalance: {rs: 1.0, rd: 51.0e+3, cd: 47.0e-9}   # in series with one lead
    c_source: 200.0e-12                               # mains-to-body coupling in the CMRR test

# --- Fault model ---------------------------------------------------------------
faults:
  r_open: 1.0e+9               # series resistance modelling an open circuit
  r_short: 1.0                 # parallel resistance modelling a short circuit
  parametric: [-0.5, -0.2, -0.1, -0.05, 0.05, 0.1, 0.2, 0.5]
  cap_degradation:             # capacitance loss + series resistance
    - {c_loss: 0.2, esr: 10.0}
    - {c_loss: 0.5, esr: 100.0}
  opamp:                       # discrete op-amps
    vos: [0.02, 0.05]          # absolute input offset [V]
    aol_factor: [0.01, 0.001]  # open-loop gain multiplied by this factor
  ina:                         # integrated block (optional in the plan)
    vos: [5.0e-3, 20.0e-3]
    cmrr_db: [70.0, 50.0]
    gain_error: [-0.05, -0.2]
  electrode:
    r_off: 1.0e+9              # series resistance of a detached electrode
    high_z_factor: [5.0, 20.0] # gel drying: Rd * k, Cd / k

# --- Measurements the instrument can take on itself ------------------------------
measurement:
  # DC readings (`dc_nodes`, per circuit): `out` is the main ADC channel; nodes marked
  # `extended` assume a spare ADC channel and are only used by the C1x feature set.
  ac:
    freqs: [0.5, 10.0, 50.0, 150.0]
    sweep: {fstart: 0.05, fstop: 1.0e+4, points_per_decade: 100}
    diff_amplitude: 1.0e-3     # differential test tone [V]
    cm_amplitude: 0.1          # common-mode test tone injected at the RLD reference [V]
    n_samples: 1000            # ADC samples used to estimate each tone
  lead_off:                    # AC lead-off style contact-impedance measurement
    freqs: [10.0, 100.0]
    current: 1.0e-9            # differential test current [A]
  pulse:
    amplitude: 1.0e-3          # 1 mV calibration pulse
    delay: 0.1
    width: 0.2
    edge: 1.0e-4
    duration: 1.0
    fs: 1000.0                 # ADC sampling rate [Hz]

# --- Dataset size ----------------------------------------------------------------
dataset:
  n_healthy: 5000
  n_per_fault: 200
