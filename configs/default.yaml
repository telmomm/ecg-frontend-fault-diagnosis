# Study configuration. Every number that defines the dataset lives here and is
# copied into the dataset manifest, so a dataset can always be regenerated.
# The block of the selected circuit (`circuits.<name>`) is merged over the rest.

seed: 20261002
circuit: integrated            # integrated (main) | reference (discrete three-op-amp)

circuits:
  integrated:                  # single 3.3 V supply, INA333 + discrete network
    supply: {vcc: 3.3, vee: 0.0}
    opamp:                     # discrete op-amps: precision rail-to-rail CMOS class (part not fixed)
      aol: 1.0e+6
      gbw: 1.0e+6
      rout: 50.0
      en: 30.0e-9              # white input voltage noise [V/sqrt(Hz)]
      headroom: 0.05           # output saturates at rail -+ headroom [V]
      vos_max: 0.5e-3          # Monte Carlo: offset drawn in +-vos_max [V]
      aol_rel: 0.5             # Monte Carlo: aol drawn in nominal * (1 +- aol_rel)
    ina:                       # behavioural model of the TI INA333 (data sheet SBOS445C)
      rfb: 50.0e+3             # internal feedback resistors: G = 1 + 100 kOhm / Rg
      rdiff: 150.0e+3          # internal difference-stage resistors
      aol: 1.0e+6
      gbw: 350.0e+3            # -3 dB bandwidth 35 kHz at G = 10
      rout: 50.0
      en: 35.0e-9              # per input amplifier: 50 nV/sqrt(Hz) referred to the input
      headroom: 0.05           # output swing to within 50 mV of the rails
      cmrr_db: 102.0           # at G = 4: between 90 dB (G = 1) and 110 dB (G = 10) typical
      cmrr_db_tol: 10.0        # Monte Carlo: down to the interpolated minimum, 92 dB
      vos_max: 44.0e-6         # +-25 uV +- 75 uV / G, referred to the input
      gain_error_max: 2.5e-3   # +-0.25 % maximum
    measurement:
      adc: {bits: 12, vmin: 0.0, vmax: 3.3, noise_rms: 1.0e-3, dc_averages: 64}
      dc_nodes:
        out: {scale: 1.0, extended: false}
        ina_out: {scale: 1.0, extended: true}
        rld_out: {scale: 1.0, extended: true}
  reference:                   # +-5 V, discrete three-op-amp INA (version 1 circuit)
    supply: {vcc: 5.0, vee: -5.0}
    opamp:                     # TL07x-like figures
      aol: 2.0e+5
      gbw: 3.0e+6
      rout: 50.0
      en: 18.0e-9
      headroom: 1.5
      vos_max: 3.0e-3
      aol_rel: 0.5
    measurement:
      adc: {bits: 12, vmin: -2.5, vmax: 2.5, noise_rms: 1.0e-3, dc_averages: 64}
      dc_nodes:
        out: {scale: 1.0, extended: false}
        ina_out: {scale: 0.5, extended: true}
        rld_out: {scale: 0.5, extended: true}

# --- Normal manufacturing variation (healthy circuits) -----------------------
tolerances:
  distribution: uniform        # uniform | truncnorm (sigma = tol/3, truncated at +-tol)
  resistor: 0.01
  capacitor: 0.05
  overrides: {}                # per designator, e.g. {C5: 0.10}

# --- Skin-electrode interface: Ehc in series with Rs and (Rd || Cd) ------------
# Healthy ranges per family, drawn log-uniformly per electrode. Gel brackets the
# 51 kOhm || 47 nF network of the ECG standards; dry follows the ranges collected in
# the state-of-the-art review (docs/circuit.md lists the sources and what is assumed).
electrodes:
  nominal: {ehc: 0.222, rs: 1.0e+3, rd: 51.0e+3, cd: 47.0e-9}
  ehc_abs: 5.0e-3              # half-cell potential spread, +- [V]
  families:
    gel: {rs: [100.0, 1.0e+3], rd: [20.0e+3, 100.0e+3], cd: [20.0e-9, 100.0e-9]}
    dry: {rs: [50.0, 100.0e+3], rd: [80.0e+3, 3.0e+6], cd: [2.0e-9, 50.0e-9]}
  mix: {gel: 0.5, dry: 0.5}    # probability of each family per simulated case

# Patient/mains coupling in service (Winter & Webster model). Mains is off during self-test.
environment:
  c_mains_body: 2.0e-12
  c_body_earth: 200.0e-12
  c_iso: 200.0e-12
  r_iso: 1.0e+9
  mains_freq: 50.0

# --- Clinical specifications (functional severity) -----------------------------
# Limits and test set-up of IEC 60601-2-25:2011, clause 201.12.4 (diagnostic
# electrocardiographs). docs/circuit.md gives the source of each value. Specifications
# are properties of the circuit, so they are evaluated with the standard test
# networks at the inputs, not with the patient's electrodes.
specs:
  gain_error_max: 0.05         # |G / G_nominal - 1| at 10 Hz
  resp_dev_lf_max: 0.10        # 0.67-40 Hz: |G(f) / G(10 Hz) - 1|
  resp_min_hf_min: 0.70        # 40-150 Hz: G(f) / G(10 Hz) not below -30 %
  resp_max_hf_max: 1.10        # 40-150 Hz: G(f) / G(10 Hz) not above +10 %
  impulse_offset_max_uv: 100.0 # baseline shift after a 3 mV, 100 ms impulse, input-referred
  impulse_slope_max_uvs: 300.0 # baseline slope after the impulse [uV/s]
  cmrr_min_db: 89.0            # 10 V rms common mode -> at most 1 mV p-v at the input
  noise_max_uvpp: 30.0         # input-referred, 51 kOhm || 47 nF in both leads, 6.6 x rms
  zin_drop_max: 0.20           # signal loss with 620 kOhm || 4.7 nF in series with a lead
  offset_gain_error_max: 0.05  # gain change at 10 Hz with +-300 mV electrode offset
  input_range_min_mv: 5.0      # linear input range left by the gain and the output offset
  electrode_offset: 0.3        # [V]
  impulse: {amplitude: 3.0e-3, width: 0.1}
  test_network:
    imbalance: {rd: 51.0e+3, cd: 47.0e-9}      # CMRR and noise tests
    input_impedance: {rd: 620.0e+3, cd: 4.7e-9, freqs: [0.67, 40.0]}
    # 20 V rms mains-frequency source behind a 100 pF divider: 10 V rms unloaded
    cm_source: {c_series: 100.0e-12, c_shunt: 100.0e-12}

# --- Fault model ---------------------------------------------------------------
faults:
  r_open: 1.0e+9               # series resistance modelling an open circuit
  r_short: 1.0                 # parallel resistance modelling a short circuit
  parametric: [-0.5, -0.2, -0.1, -0.05, 0.05, 0.1, 0.2, 0.5]
  cap_degradation:             # capacitance loss + series resistance
    - {c_loss: 0.2, esr: 10.0}
    - {c_loss: 0.5, esr: 100.0}
  opamp:                       # discrete op-amps
    vos: [0.02, 0.05]          # absolute input offset [V]
    aol_factor: [0.01, 0.001]  # open-loop gain multiplied by this factor
  ina:                         # integrated block (optional in the plan)
    vos: [5.0e-3, 20.0e-3]
    cmrr_db: [70.0, 50.0]
    gain_error: [-0.05, -0.2]
  electrode:
    r_off: 1.0e+9              # series resistance of a detached electrode
    high_z_factor: [5.0, 20.0] # gel drying: Rd * k, Cd / k

# --- Measurements the instrument can take on itself ------------------------------
measurement:
  # DC readings (`dc_nodes`, per circuit): `out` is the main ADC channel; nodes marked
  # `extended` assume a spare ADC channel and are only used by the C1x feature set.
  ac:
    freqs: [0.05, 0.5, 10.0, 50.0, 150.0]
    sweep: {fstart: 0.01, fstop: 1.0e+4, points_per_decade: 100}
    diff_amplitude: 1.0e-3     # differential test tone [V]
    cm_amplitude: 0.1          # common-mode test tone injected at the RLD reference [V]
    n_samples: 1000            # ADC samples used to estimate each tone
  lead_off:                    # AC lead-off style contact-impedance measurement
    freqs: [10.0, 100.0]
    current: 1.0e-9            # differential test current [A]
  pulse:
    amplitude: 1.0e-3          # 1 mV calibration pulse
    delay: 0.1
    width: 0.2
    edge: 1.0e-4
    duration: 1.0
    fs: 1000.0                 # ADC sampling rate [Hz]

# --- Dataset size ----------------------------------------------------------------
dataset:
  n_healthy: 5000
  n_per_fault: 200
