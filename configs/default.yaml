# Study configuration. Every number that defines the dataset lives here and is
# copied into the dataset manifest, so a dataset can always be regenerated.
# The block of the selected circuit (`circuits.<name>`) is merged over the rest.

seed: 20261002
circuit: integrated            # integrated (main) | reference (discrete three-op-amp)

circuits:
  integrated:                  # single 3.3 V supply, INA333 + discrete network
    supply: {vcc: 3.3, vee: 0.0}
    opamp:                     # discrete op-amps: precision rail-to-rail CMOS class (part not fixed)
      aol: 1.0e+6
      gbw: 1.0e+6
      rout: 50.0
      en: 30.0e-9              # white input voltage noise [V/sqrt(Hz)]
      headroom: 0.05           # output saturates at rail -+ headroom [V]
      vos_max: 0.5e-3          # Monte Carlo: offset drawn in +-vos_max [V]
      aol_rel: 0.5             # Monte Carlo: aol drawn in nominal * (1 +- aol_rel)
    ina:                       # behavioural model of the TI INA333 (data sheet SBOS445C)
      rfb: 50.0e+3             # internal feedback resistors: G = 1 + 100 kOhm / Rg
      rdiff: 150.0e+3          # internal difference-stage resistors
      aol: 1.0e+6
      gbw: 350.0e+3            # -3 dB bandwidth 35 kHz at G = 10
      rout: 50.0
      en: 35.0e-9              # per input amplifier: 50 nV/sqrt(Hz) referred to the input
      headroom: 0.05           # output swing to within 50 mV of the rails
      cmrr_db: 102.0           # at G = 4: between 90 dB (G = 1) and 110 dB (G = 10) typical
      cmrr_db_tol: 10.0        # Monte Carlo: down to the interpolated minimum, 92 dB
      vos_max: 44.0e-6         # +-25 uV +- 75 uV / G, referred to the input
      gain_error_max: 2.5e-3   # +-0.25 % maximum
    measurement:
      adc: {bits: 12, vmin: 0.0, vmax: 3.3, noise_rms: 1.0e-3, dc_averages: 64}
      dc_nodes:
        out: {scale: 1.0}
        ina_out: {scale: 1.0}
        rld_out: {scale: 1.0}
  reference:                   # +-5 V, discrete three-op-amp INA (version 1 circuit)
    supply: {vcc: 5.0, vee: -5.0}
    opamp:                     # TL07x-like figures
      aol: 2.0e+5
      gbw: 3.0e+6
      rout: 50.0
      en: 18.0e-9
      headroom: 1.5
      vos_max: 3.0e-3
      aol_rel: 0.5
    measurement:
      adc: {bits: 12, vmin: -2.5, vmax: 2.5, noise_rms: 1.0e-3, dc_averages: 64}
      dc_nodes:
        out: {scale: 1.0}
        ina_out: {scale: 0.5}
        rld_out: {scale: 0.5}

# --- Normal manufacturing variation (healthy circuits) -----------------------
tolerances:
  distribution: uniform        # uniform | truncnorm (sigma = tol/3, truncated at +-tol)
  resistor: 0.01
  capacitor: 0.05
  overrides: {}                # per designator, e.g. {C5: 0.10}

# --- Skin-electrode interface: Ehc in series with Rs and (Rd || Cd) ------------
# Each case draws a family, then an electrode type of that family (the same for the
# three electrodes) and, for dry electrodes, one of the measured subjects, whose
# contact resistance replaces the median Rd (Cd is scaled to keep Rd * Cd). Then every
# parameter of every electrode is drawn log-uniformly within value / spread ..
# value * spread. docs/circuit.md gives the sources and what is assumed.
electrodes:
  nominal: {ehc: 0.222, rs: 1.0e+3, rd: 51.0e+3, cd: 47.0e-9}
  ehc_abs: 5.0e-3              # half-cell potential spread, +- [V] (assumed)
  spread: 2.0                  # electrode-to-electrode spread within a case (assumed)
  mix: {gel: 0.5, dry: 0.5}    # probability of each family per simulated case
  families:
    gel:                       # network that IEC 60601-2-25 puts in series with each lead
      ag_agcl_gel: {rs: 300.0, rd: 51.0e+3, cd: 47.0e-9}
    # Sci. Rep. 14:8882 (2024). rs, rd, cd: medians of Table 3 converted from the measured
    # electrode pair to one electrode (half the resistances, twice the capacitance).
    # subject_rd: half the mean |Z| from 1 to 100 Hz of each of the six subjects after
    # 10 minutes (open data, doi:10.17632/j9rt95468p.5), taken as that subject's Rd.
    dry:
      conductive_polymer:
        rs: 110
        rd: 1.01e+06
        cd: 9.28e-09
        subject_rd: [1.09e+06, 2.58e+05, 1.25e+06, 2.75e+06, 6.28e+05, 5.38e+05]
      fabric_no_membrane:
        rs: 124.5
        rd: 4.47e+06
        cd: 8.8e-10
        subject_rd: [1.59e+07, 5.29e+06, 2.48e+07, 1.04e+06, 3.36e+06, 1.15e+06]
      fabric_membrane:
        rs: 113
        rd: 3.69e+06
        cd: 1.35e-09
        subject_rd: [6.58e+06, 1.2e+06, 6.84e+07, 6.56e+05, 4.69e+06, 1.81e+06]
      stainless_steel:
        rs: 51
        rd: 6.1e+04
        cd: 1.21e-07
        subject_rd: [4.35e+05, 3.22e+04, 9.39e+04, 3.93e+05, 1.07e+03, 637]
      silver:
        rs: 83.5
        rd: 2.965e+05
        cd: 1.186e-07
        subject_rd: [4.38e+05, 3.88e+05, 4.95e+05, 1.52e+05, 1.14e+03, 753]
      platinum:
        rs: 24
        rd: 2.09e+05
        cd: 1.088e-05
        subject_rd: [5.79e+05, 3.77e+05, 799, 5.42e+05, 1.17e+03, 828]

# Patient/mains coupling in service (Winter & Webster model). Mains is off during self-test.
environment:
  c_mains_body: 2.0e-12
  c_body_earth: 200.0e-12
  c_iso: 200.0e-12
  r_iso: 1.0e+9
  mains_freq: 50.0

# --- Clinical specifications (functional severity) -----------------------------
# Limits and test set-up of IEC 60601-2-25:2011 (EN 60601-2-25:2015), clause 201.12.4;
# the subclause of each one is given. Specifications are properties of the circuit,
# so they are evaluated with the standard test networks at the inputs, not with the
# patient's electrodes.
specs:
  gain_error_max: 0.05         # 201.12.1.101.2 / 201.12.4.107.1.2: amplitudes within 5 %
  resp_dev_lf_max: 0.10        # Table 201.107 test A: 0.67-40 Hz within +-10 % of 10 Hz
  resp_min_hf_min: 0.70        # tests B, C: 40-150 Hz not below -30 %
  resp_max_hf_max: 1.10        # tests B, C, D: 40-500 Hz not above +10 %
  impulse_offset_max_uv: 100.0 # 201.12.4.107.1.1.2: 0.1 mV displacement after 3 mV x 100 ms
  impulse_slope_max_uvs: 300.0 # 201.12.4.107.1.1.2: 0.30 mV/s after the impulse
  cmrr_min_db: 89.0            # 201.12.4.105.1: 10 V rms -> 1 mV peak-to-valley at the input
  noise_max_uvpp: 30.0         # 201.12.4.106.1: 30 uV peak-to-valley referred to the input
  zin_drop_max: 0.20           # 201.12.4.103: at most 20 % loss (2.5 MOhm)
  offset_gain_error_max: 0.05  # 201.12.4.107.2: 5 % with +-300 mV offset
  input_range_min_mv: 5.0      # 201.12.4.107.2: +-5 mV input signal
  electrode_offset: 0.3        # [V]
  impulse: {amplitude: 3.0e-3, width: 0.1}
  test_network:
    imbalance: {rd: 51.0e+3, cd: 47.0e-9}      # CMRR and noise tests
    input_impedance: {rd: 620.0e+3, cd: 4.7e-9, freqs: [0.67, 40.0]}
    # 20 V rms source behind a 100 pF divider (10 V rms unloaded, 200 pF source), 50 and 60 Hz
    cm_source: {c_series: 100.0e-12, c_shunt: 100.0e-12, freqs: [50.0, 60.0]}

# --- Fault model ---------------------------------------------------------------
faults:
  r_open: 1.0e+9               # series resistance modelling an open circuit
  r_short: 1.0                 # parallel resistance modelling a short circuit
  parametric: [-0.5, -0.2, -0.1, -0.05, 0.05, 0.1, 0.2, 0.5]
  cap_degradation:             # capacitance loss + series resistance
    - {c_loss: 0.2, esr: 10.0}
    - {c_loss: 0.5, esr: 100.0}
  opamp:                       # discrete op-amps
    vos: [0.02, 0.05]          # absolute input offset [V]
    aol_factor: [0.01, 0.001]  # open-loop gain multiplied by this factor
  ina:                         # integrated block (optional in the plan)
    vos: [5.0e-3, 20.0e-3]
    cmrr_db: [70.0, 50.0]
    gain_error: [-0.05, -0.2]
  electrode:
    r_off: 1.0e+9              # series resistance of a detached electrode
    high_z_factor: [5.0, 20.0] # gel drying: Rd * k, Cd / k

# --- Measurements the instrument can take on itself ------------------------------
measurement:
  # DC readings (`dc_nodes`, per circuit): `scale` is the divider in front of the ADC.
  # Which nodes enter each feature set is decided in src/ecgfd/features.py.
  ac:
    freqs: [0.05, 0.5, 10.0, 50.0, 150.0]
    sweep: {fstart: 0.01, fstop: 1.0e+4, points_per_decade: 100}
    diff_amplitude: 1.0e-3     # differential test tone [V]
    cm_amplitude: 0.1          # common-mode test tone injected at the RLD reference [V]
    n_samples: 1000            # ADC samples used to estimate each tone
  lead_off:                    # AC lead-off style contact-impedance measurement
    freqs: [10.0, 100.0]
    current: 1.0e-9            # differential test current [A]
  pulse:
    amplitude: 1.0e-3          # 1 mV calibration pulse
    delay: 0.1
    width: 0.2
    edge: 1.0e-4
    duration: 1.0
    fs: 1000.0                 # ADC sampling rate [Hz]

# --- Dataset size ----------------------------------------------------------------
dataset:
  n_healthy: 5000
  n_per_fault: 200
