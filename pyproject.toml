[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecgfd"
version = "0.1.0"
description = "Simulation-based fault diagnosis of an ECG analog front-end (ngspice + machine learning)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dl = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5", "schemdraw>=0.19"]

[project.scripts]
ecgfd = "ecgfd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecgfd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ngspice: test needs the ngspice executable"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ecgfd", "_common"]
